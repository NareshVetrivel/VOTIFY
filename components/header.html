<!-- =========================
     VOTIFY Reusable Header
     File : components/header.html
========================== -->

<header
    class="relative w-full border-b border-white/10 bg-[#0B1020]/80 backdrop-blur-2xl shadow-[0_8px_30px_rgba(0,0,0,.35)]">

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

        <div class="flex items-center justify-between py-2">

            <!-- Left : VOTIFY Logo + College Name -->
            <div class="flex items-center gap-3 sm:gap-4">

                <!-- VOTIFY Logo -->
                <a
                    href="/"
                    aria-label="VOTIFY Home"
                    class="flex-shrink-0">

                    <img
                        src="/assets/images/logo.png"
                        alt="VOTIFY Logo"
                        class="w-14 h-14 sm:w-16 sm:h-16 md:w-20 md:h-20 object-contain select-none drop-shadow-[0_0_25px_rgba(59,130,246,.35)] transition-all duration-500 hover:scale-105"
                        loading="eager">
                </a>

                <!-- College / Platform Details -->
                <div class="min-w-0">

                    <h1
                        class="text-white text-lg sm:text-xl md:text-2xl font-extrabold tracking-wide leading-tight">
                        Sona College of Technology
                    </h1>

                    <p
                        class="mt-0.5 text-xs sm:text-sm md:text-base font-semibold bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
                        Online Voting Platform
                    </p>

                </div>

            </div>

        </div>

    </div>

</header>
