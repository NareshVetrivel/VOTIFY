<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>

        Admin Login | VOTIFY

    </title>

    <!-- Tailwind CSS -->

    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Remix Icons -->

    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.3.0/fonts/remixicon.css"
        rel="stylesheet">

    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="../../assets/css/custom.css">

    <link
        rel="stylesheet"
        href="../../assets/css/animations.css">

</head>

<body
class="bg-[#0B1020]
text-white
min-h-screen
flex
flex-col
overflow-x-hidden">

<!-- ==========================================
     Loader
========================================== -->

<div id="loader-container"></div>


<!-- ==========================================
     Animated Background
========================================== -->

<div
class="fixed
inset-0
-z-10
overflow-hidden">

    <div
    class="absolute
    top-0
    left-0
    w-96
    h-96
    bg-blue-600/20
    blur-[140px]
    rounded-full">
    </div>

    <div
    class="absolute
    bottom-0
    right-0
    w-96
    h-96
    bg-pink-600/20
    blur-[150px]
    rounded-full">
    </div>

    <div
    class="absolute
    top-1/2
    left-1/2
    w-80
    h-80
    bg-purple-600/20
    blur-[120px]
    rounded-full
    -translate-x-1/2
    -translate-y-1/2">
    </div>

</div>


<!-- ==========================================
     Header
========================================== -->

<div id="header"></div>


<!-- ==========================================
     Login Section
========================================== -->

<section
class="flex-1
flex
items-center
justify-center
py-14
px-6">

<div
class="w-full
max-w-md">

<!-- ==========================================
     Heading
========================================== -->

<div
class="text-center
mb-10">

    <h1
    class="mt-6
    text-4xl
    md:text-5xl
    font-bold">

        <span
        class="gradient-text">

            Admin Login

        </span>

    </h1>

    <p
    class="mt-4
    text-slate-400">

        Secure Administrative Access

    </p>

</div>


<!-- ==========================================
     Login Card
========================================== -->

<div
class="glass
rounded-3xl
p-8
md:p-10
shadow-2xl">

<!-- ==========================================
     Login Form
========================================== -->

<form
id="adminLoginForm"
class="space-y-7">

    <!-- ========================= -->
    <!-- Username -->
    <!-- ========================= -->

    <div>

        <label
        for="username"
        class="block
        mb-2
        font-medium
        text-slate-300">

            Admin Username
            <span class="text-pink-400">*</span>

        </label>

        <div class="relative">

            <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter Admin Username"
            maxlength="30"
            autocomplete="off"
            class="w-full
            h-14
            pl-12
            pr-5
            rounded-xl
            bg-white/5
            border
            border-white/10
            text-white
            placeholder:text-slate-500
            focus:border-blue-500
            focus:ring-4
            focus:ring-blue-500/20
            outline-none
            transition-all"
            required>

            <i
            class="ri-admin-line
            absolute
            left-4
            top-1/2
            -translate-y-1/2
            text-slate-400
            text-xl">
            </i>

        </div>

        <p
        id="usernameError"
        class="hidden
        mt-2
        text-sm
        text-red-400
        font-medium">
        </p>

    </div>


    <!-- ========================= -->
    <!-- Password -->
    <!-- ========================= -->

    <div>

        <label
        for="password"
        class="block
        mb-2
        font-medium
        text-slate-300">

            Password
            <span class="text-pink-400">*</span>

        </label>

        <div class="relative">

            <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter Password"
            class="w-full
            h-14
            pl-12
            pr-14
            rounded-xl
            bg-white/5
            border
            border-white/10
            text-white
            placeholder:text-slate-500
            focus:border-blue-500
            focus:ring-4
            focus:ring-blue-500/20
            outline-none
            transition-all"
            required>

            <i
            class="ri-lock-password-line
            absolute
            left-4
            top-1/2
            -translate-y-1/2
            text-slate-400
            text-xl">
            </i>

<button
type="button"
id="togglePassword"
aria-label="Show or hide password"
class="absolute
right-5
top-1/2
-translate-y-1/2
text-slate-400
hover:text-blue-400
transition">

    <i
    class="ri-eye-line
    text-xl">
    </i>

</button>

        </div>

        <p
        id="passwordError"
        class="hidden
        mt-2
        text-sm
        text-red-400
        font-medium">
        </p>

    </div>


    <!-- ========================= -->
    <!-- Login Button -->
    <!-- ========================= -->

    <button
    type="submit"
    id="loginButton"
    class="btn-primary
    w-full
    py-4
    rounded-xl
    text-lg
    font-semibold">

        <i class="ri-login-circle-line"></i>

        Login Securely

    </button>

</form>

</div>

</div>

</section>


<!-- ==========================================
     Success Toast
========================================== -->

<div
id="successToast"
class="fixed
top-6
right-6
translate-x-[120%]
transition-all
duration-500
bg-green-600
text-white
px-6
py-4
rounded-xl
shadow-2xl
z-[9999]">

    <div
    class="flex
    items-center
    gap-3">

        <i
        class="ri-checkbox-circle-fill
        text-2xl">
        </i>

        <div>

            <p
            class="font-semibold">

                Login Successful

            </p>

            <p
            class="text-sm
            text-green-100">

                Redirecting to Dashboard...

            </p>

        </div>

    </div>

</div>


<!-- ==========================================
     Error Toast
========================================== -->

<div
id="errorToast"
class="fixed
top-6
right-6
translate-x-[120%]
transition-all
duration-500
bg-red-600
text-white
px-6
py-4
rounded-xl
shadow-2xl
z-[9999]">

    <div
    class="flex
    items-center
    gap-3">

        <i
        class="ri-close-circle-fill
        text-2xl">
        </i>

        <div>

            <p
            class="font-semibold">

                Login Failed

            </p>

            <p
            id="errorToastMessage"
            class="text-sm
            text-red-100">

                Invalid Username or Password

            </p>

        </div>

    </div>

</div>


<!-- ==========================================
     Footer
========================================== -->

<div id="footer"></div>


<!-- ==========================================
     Scripts
========================================== -->

<script src="../../assets/js/app.js"></script>

<script src="../../assets/js/admin-login.js"></script>

</body>

</html>
